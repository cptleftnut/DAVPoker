name: Code Quality

on:
  push:
    branches:
      - main
      - master
      - mobile
  pull_request:
    branches:
      - main
      - master
      - mobile

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check package.json
        run: |
          echo "Checking package.json..."
          node -e "require('./package.json')"

      - name: Check app.json
        run: |
          echo "Checking app.json..."
          node -e "require('./app.json')"

      - name: Check eas.json
        run: |
          echo "Checking eas.json..."
          node -e "require('./eas.json')"

      - name: Verify file structure
        run: |
          echo "Verifying project structure..."
          test -f App.tsx && echo "✓ App.tsx found"
          test -d src/screens && echo "✓ src/screens found"
          test -f .github/workflows/android-release.yml && echo "✓ Workflow found"
          test -f README.md && echo "✓ README found"
          test -f DEPLOYMENT_GUIDE.md && echo "✓ Deployment guide found"

      - name: Check dependencies
        run: |
          echo "Checking critical dependencies..."
          npm list expo react react-native @react-navigation/native

      - name: Generate SBOM (Software Bill of Materials)
        run: |
          npm list --all > SBOM.txt
          echo "SBOM generated"
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: SBOM.txt
        continue-on-error: true

      - name: Security audit
        run: npm audit --production
        continue-on-error: true

      - name: Check for vulnerabilities
        run: |
          echo "Checking for known vulnerabilities..."
          npm audit --audit-level=moderate
        continue-on-error: true

      - name: Create summary
        run: |
          echo "## Code Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Configuration files validated" >> $GITHUB_STEP_SUMMARY
          echo "✓ Project structure verified" >> $GITHUB_STEP_SUMMARY
          echo "✓ Dependencies checked" >> $GITHUB_STEP_SUMMARY
          echo "✓ Security audit completed" >> $GITHUB_STEP_SUMMARY
